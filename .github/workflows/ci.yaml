name: Build and Test AdminBundle

on:
    - push

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        env:
            extensions: json
            composer_version: 2
        strategy:
            matrix:
                php_version:
                    - '8.4'
        steps:
            -   uses: actions/checkout@v3

            -   name: Restore cached vendors
                uses: actions/cache/restore@v4
                with:
                    path: |
                        node_modules
                        vendor
                    key: ${{ runner.os }}-vendor

            -   name: Setup PHP with extensions
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php_version }}
                    extensions: ${{ env.extensions }}
                    ini-values: memory_limit=-1
                    coverage: pcov
                    tools: composer, php-cs-fixer, cs2pr

            -   name: Install dependencies
                run: composer install --no-interaction

            -   name: Install yarn dependencies
                run: yarn install --force

            -   name: Build yarn dependencies
                run: yarn run encore production

            -   name: Copy assets files for functionnal tests
                run: mkdir -p tests/app/public/build && cp -r public/* tests/app/public/build

            -   name: Run phpunit unit test suite
                run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite "AdminBundle Test Suite"

                # The functional suite boots the kernel, so it only passes once a change is complete. Feature
                # branches are reviewed as a stack of partial steps, where an intermediate branch is not expected
                # to run the application — running it there would report a failure the reviewer cannot act on.
            -   name: Run docker compose
                if: ${{ github.ref_name == 'master' || github.ref_name == 'feat/v2.0' }}
                run: docker compose up -d database && sleep 10 && docker compose logs database

            -   name: Run phpunit functional test suite
                if: ${{ github.ref_name == 'master' || github.ref_name == 'feat/v2.0' }}
                run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite "AdminBundle Functional Test Suite"

            -   name: Run php-cs-fixer
                run: PHP_CS_FIXER_IGNORE_ENV=1 php-cs-fixer fix --dry-run --using-cache=no --verbose --diff --allow-risky=yes --config .php-cs-fixer.dist.php

            -   name: Run phpstan
                run: vendor/bin/phpstan analyse

            -   name: Run var_dump checker
                run: vendor/bin/var-dump-check --symfony src tests

            -   name: Run Rector
                run: vendor/bin/rector --dry-run

            -   name: Stop docker compose
                if: ${{ github.ref_name == 'master' || github.ref_name == 'feat/v2.0' }}
                run: docker compose down

            -   name: Cache vendors
                uses: actions/cache/save@v4
                with:
                    path: |
                        node_modules
                        vendor
                    key: ${{ runner.os }}-vendor
